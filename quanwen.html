<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="js/theme-init.js"></script>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古籍全文库 | 易经本体论</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E7%B1%8D%3C/text%3E%3C/svg%3E">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-serif,'Songti SC','STSong','SimSun',serif); background:transparent; color:var(--ink); line-height:2; }
.qw-head { text-align:center; margin-bottom:22px; }
.qw-head h1 { font-size:40px; color:var(--zhu); letter-spacing:8px; margin-bottom:6px; }
.qw-head p { color:var(--gold); font-size:14px; }
.qw-stat { text-align:center; font-size:13px; color:var(--ink-3); margin-top:8px; }
.qw-bar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center; margin:20px 0 8px; }
.qw-search { flex:1; min-width:220px; max-width:420px; padding:10px 14px; font-size:15px;
  background:var(--input-bg,var(--paper-2)); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius,6px); font-family:inherit; }
.qw-search:focus { outline:none; border-color:var(--zhu); }
.qw-tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
.qw-tab { cursor:pointer; font-size:13px; padding:6px 14px; border:1px solid var(--line); border-radius:99px;
  background:var(--paper-2); color:var(--ink-2); transition:.2s; }
.qw-tab:hover { border-color:var(--zhu); color:var(--zhu); }
.qw-tab.on { background:var(--zhu); color:var(--on-accent,#fff); border-color:var(--zhu); font-weight:700; }
.qw-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin-bottom:26px; }
.qw-card { cursor:pointer; border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:var(--radius,6px);
  background:var(--card,var(--paper-2)); padding:12px 14px; transition:.18s; }
.qw-card:hover { border-left-color:var(--zhu); transform:translateY(-1px); box-shadow:var(--shadow); }
.qw-card.on { border-left-color:var(--zhu); background:var(--chip-bg); }
.qw-card .t { font-size:15px; font-weight:700; color:var(--zhu); }
.qw-card .a { font-size:12px; color:var(--ink-3); margin-top:3px; }
.qw-card .n { font-size:11px; color:var(--gold); margin-top:4px; }
.qw-reader { border-top:2px solid var(--zhu); padding-top:26px; }
.qw-reader .rt { font-size:28px; color:var(--zhu); text-align:center; letter-spacing:4px; }
.qw-reader .rm { text-align:center; font-size:13px; color:var(--gold); margin:8px 0 4px; }
.qw-reader .rbar { display:flex; justify-content:center; gap:12px; margin:12px 0 26px; flex-wrap:wrap; }
.qw-reader .rbar a, .qw-reader .rbar button { font-size:13px; cursor:pointer; font-family:inherit; text-decoration:none;
  padding:6px 16px; border:1px solid var(--line); border-radius:99px; background:var(--paper-2); color:var(--zhu); }
.qw-reader .rbar a:hover, .qw-reader .rbar button:hover { background:var(--zhu); color:var(--on-accent,#fff); }
.qw-text { max-width:820px; margin:0 auto; font-size:17px; line-height:2.25; }
.qw-text p { text-indent:2em; margin-bottom:6px; }
.qw-text p.plain { text-indent:0; }
.qw-empty { text-align:center; color:var(--ink-3); font-size:14px; padding:60px 20px; }
.qw-loading { text-align:center; color:var(--gold); font-size:14px; padding:40px; }
.qw-note { max-width:820px; margin:30px auto 0; padding:14px 18px; font-size:13px; color:var(--ink-2);
  background:var(--chip-bg); border-left:3px solid var(--gold); border-radius:var(--radius,6px); line-height:1.9; }
@media (max-width:760px){
  .qw-head h1 { font-size:28px; letter-spacing:5px; }
  .qw-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .qw-text { font-size:16px; }
  .qw-reader .rt { font-size:22px; }
}
</style>
<script>window.__CLASSICS_DISABLED = true;</script>
<script src="js/apply-shell.js?v=20261111a" data-page="quanwen"></script>
</head>
<body>
<div class="wrap">
  <div class="qw-head">
    <h1>古籍全文库</h1>
    <p>易学注疏 · 术数筮法 · 丹道道家 · 医易同源 · 诸子儒家</p>
    <div class="qw-stat" id="qwStat"></div>
  </div>

  <div class="qw-bar">
    <input class="qw-search" id="qwSearch" type="search" placeholder="检索书名 / 作者（如：王弼、参同契、纳甲）…">
  </div>
  <div class="qw-tabs" id="qwTabs"></div>
  <div class="qw-grid" id="qwGrid"></div>

  <div class="qw-reader" id="qwReader" style="display:none;">
    <div class="rt" id="qwTitle"></div>
    <div class="rm" id="qwMeta"></div>
    <div class="rbar">
      <a id="qwDl" download>⬇ 下载本篇 .txt</a>
      <button id="qwTop">↑ 回到书目</button>
    </div>
    <div class="qw-text" id="qwText"></div>
  </div>
  <div class="qw-empty" id="qwHint">点击上方书目卡片，即可在线阅读全文（原文下载自公版古籍库）</div>

  <div class="qw-note">
    <b>关于底本：</b>本库全部文本取自公开的<b>殆知阁古代文献</b>（<a href="https://github.com/garychowcmu/daizhigev20" target="_blank" rel="noopener">garychowcmu/daizhigev20</a>），所收均为先秦至清代的<b>公版古籍</b>，可自由下载、研读、再发布。
    现代学者（20 世纪及以后）的注本与研究著作仍在版权保护期内，本库不收录其全文，仅在「注疏」等页面保留必要的短篇引文与书目信息。
  </div>
</div>

<script src="data/texts-index.js?v=20261111d"></script>
<script>
(function(){
  var T = window.YJ_TEXTS;
  var cur = 'all', kw = '', books = (T && T.books) || [];
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function filtered(){
    return books.filter(function(b){
      if(cur !== 'all' && b.cat !== cur) return false;
      if(kw){ var s=(b.title+b.author+b.catName).toLowerCase(); if(s.indexOf(kw.toLowerCase())<0) return false; }
      return true;
    });
  }

  function renderTabs(){
    var cats = [{key:'all',name:'全部'}, {key:'yijing',name:'易学注疏'}, {key:'shushu',name:'术数筮法'},
                {key:'daozang',name:'丹道道家'}, {key:'yizang',name:'医易同源'},
                {key:'zizang',name:'诸子'}, {key:'ruzang',name:'儒家'}];
    $('qwTabs').innerHTML = cats.map(function(c){
      var n = c.key==='all' ? books.length : books.filter(function(b){return b.cat===c.key;}).length;
      return '<span class="qw-tab'+(cur===c.key?' on':'')+'" data-cat="'+c.key+'">'+c.name+' <b>'+n+'</b></span>';
    }).join('');
    Array.prototype.forEach.call($('qwTabs').children, function(el){
      el.addEventListener('click', function(){ cur = el.getAttribute('data-cat'); renderTabs(); renderGrid(); });
    });
  }

  function renderGrid(){
    var list = filtered();
    $('qwGrid').innerHTML = list.map(function(b){
      return '<div class="qw-card'+(window.__curSlug===b.slug?' on':'')+'" data-slug="'+b.slug+'">'+
        '<div class="t">《'+esc(b.title)+'》</div>'+
        '<div class="a">'+esc(b.author)+'</div>'+
        '<div class="n">'+b.chars.toLocaleString()+' 字 · '+esc(b.catName)+'</div></div>';
    }).join('') || '<div class="qw-empty" style="grid-column:1/-1">没有匹配的书目</div>';
    Array.prototype.forEach.call($('qwGrid').querySelectorAll('.qw-card'), function(el){
      el.addEventListener('click', function(){ open(el.getAttribute('data-slug'), true); });
    });
  }

  function open(slug, push){
    var b = books.filter(function(x){return x.slug===slug;})[0];
    if(!b) return;
    window.__curSlug = slug;
    Array.prototype.forEach.call($('qwGrid').querySelectorAll('.qw-card'), function(el){
      el.classList.toggle('on', el.getAttribute('data-slug')===slug);
    });
    $('qwHint').style.display = 'none';
    $('qwReader').style.display = 'block';
    $('qwTitle').textContent = '《'+b.title+'》';
    $('qwMeta').textContent = b.author + ' · ' + b.chars.toLocaleString() + ' 字 · ' + b.catName;
    $('qwDl').href = b.file;
    $('qwDl').setAttribute('download', b.title+'.txt');
    $('qwText').innerHTML = '<div class="qw-loading">正在载入全文…</div>';
    if(push){ history.replaceState(null,'', '?book='+slug+'#'+slug); }
    $('qwReader').scrollIntoView({behavior:'smooth', block:'start'});

    fetch(b.file).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(txt){
        var render = function(n){
          var lines = txt.split(/\r?\n/);
          var html = lines.map(function(ln){
            if(ln.trim()==='') return '';
            var ind = /^[\u3000\s]/.test(ln);
            return '<p'+(ind?'':' class="plain"')+'>'+esc(ln.replace(/^[\u3000\s]+/,''))+'</p>';
          }).join('');
          if(n===0) $('qwText').innerHTML = html;
          else $('qwText').innerHTML += html;
        };
        // 大书分片渲染，避免一次性插入卡顿
        var total = txt.length;
        if(total > 120000){
          var step = 60000, i = 0, n = 0;
          var chunk = function(){ render(n); n++; };
          $('qwText').innerHTML = '';
          chunk();
          var timer = setInterval(function(){
            i += step;
            if(n*step >= total){ clearInterval(timer); return; }
            render(n);
          }, 30);
        } else { render(0); }
      })
      .catch(function(e){
        $('qwText').innerHTML = '<div class="qw-empty">全文载入失败（'+esc(e.message)+'）。<br>若在本地以 file:// 打开，请改用 http 服务访问；线上 GitHub Pages 可正常载入。</div>';
      });
  }

  function init(){
    if(!T){ $('qwHint').textContent = '数据索引未加载'; return; }
    $('qwStat').textContent = '共 ' + T.total + ' 部 · ' + T.totalChars.toLocaleString() + ' 字 · 底本：殆知阁古代文献（公版古籍）';
    renderTabs(); renderGrid();
    $('qwSearch').addEventListener('input', function(){ kw = this.value.trim(); renderGrid(); });
    $('qwTop').addEventListener('click', function(){ $('qwHead') ; $('qwTabs').scrollIntoView({behavior:'smooth'}); });
    var m = /[?&]book=([^&]+)/.exec(location.search);
    if(m){ open(decodeURIComponent(m[1]), false); }
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
