<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>六十四卦 · 易经本体论</title>
<link rel="stylesheet" href="css/yijing.css">
<script src="data/yijing-ontology.js"></script>
<script src="data/gua-full-data.js"></script>
<script src="js/ontology-linker.js"></script>
<style>
.gua-detail{display:none;}
.gua-detail.active{display:block;}
.gua-detail-card{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:28px 32px;margin-bottom:24px;
}
.gua-header{
  display:grid;grid-template-columns:140px 1fr;gap:28px;align-items:center;
  padding-bottom:20px;border-bottom:1px solid var(--line-soft);
}
.gua-symbol-lg{font-size:120px;line-height:1;color:var(--ink);text-align:center;}
.gua-meta h1{font-size:40px;color:var(--zhu);letter-spacing:8px;margin:0 0 8px;}
.gua-meta .num{font-size:13px;color:var(--gold);letter-spacing:3px;font-family:var(--font-sans);}
.gua-meta .tags{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;}
.gua-props{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;
}
.gua-prop{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:4px;
  padding:8px 12px;font-size:12px;
}
.gua-prop .k{color:var(--gold);font-family:var(--font-sans);letter-spacing:2px;}
.gua-prop .v{color:var(--ink);font-size:14px;font-weight:600;margin-top:2px;}

.yao-row{
  display:grid;grid-template-columns:60px 1fr;gap:18px;
  padding:16px 0;border-bottom:1px dashed var(--line-soft);
}
.yao-row:last-child{border-bottom:none;}
.yao-idx{
  text-align:center;border-right:1px solid var(--line-soft);padding-right:12px;
}
.yao-idx .pos{font-size:14px;color:var(--zhu);font-weight:700;letter-spacing:2px;}
.yao-idx .sym{font-size:24px;line-height:1;margin:6px 0;color:var(--ink);}
.yao-idx .yy{font-size:10px;color:var(--ink-3);letter-spacing:1px;}

.yao-text{font-family:var(--font-kai);font-size:16px;color:var(--ink);line-height:2;}
.yao-xiaoxiang{font-size:13px;color:var(--gold);font-style:italic;margin:6px 0;}
.yao-explain{font-size:13px;color:var(--ink-3);font-family:var(--font-sans);line-height:1.9;}

.related-gua{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;
}
.rel-gua-item{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:4px;
  padding:8px;text-align:center;text-decoration:none;color:inherit;
  transition:all .2s;font-size:12px;
}
.rel-gua-item:hover{background:var(--zhu);color:#fff;border-color:var(--zhu);}
.rel-gua-item .s{font-size:28px;line-height:1;display:block;margin-bottom:4px;}

.gua-list-wrap{margin-top:24px;}
.gua-filter{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;justify-content:center;
}
.gua-filter button{
  background:var(--paper-2);border:1px solid var(--line);
  padding:6px 14px;border-radius:4px;cursor:pointer;font-family:var(--font-serif);
  font-size:13px;letter-spacing:1px;color:var(--ink-2);transition:all .2s;
}
.gua-filter button:hover{border-color:var(--zhu);color:var(--zhu);}
.gua-filter button.on{background:var(--zhu);color:#fff;border-color:var(--zhu);}
.gua-grid{
  display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
}
.gua-grid-item{
  aspect-ratio:3/4;background:var(--paper-2);border:1px solid var(--line-soft);
  border-radius:4px;padding:8px 4px;text-align:center;cursor:pointer;text-decoration:none;color:inherit;
  transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gua-grid-item:hover,.gua-grid-item.active{background:var(--zhu);color:#fff;border-color:var(--zhu);transform:scale(1.06);}
.gua-grid-item .s{font-size:30px;line-height:1;margin-bottom:4px;}
.gua-grid-item .n{font-size:11px;letter-spacing:1px;}
.jump-btns{display:flex;gap:8px;margin-top:14px;}
.jump-btns a{font-size:12px;padding:4px 10px;background:var(--paper);border:1px solid var(--line-soft);border-radius:3px;text-decoration:none;color:var(--ink-2);}
.jump-btns a:hover{background:var(--zhu);color:#fff;border-color:var(--zhu);}

@media(max-width:768px){
  .gua-header{grid-template-columns:1fr;text-align:center;}
  .gua-symbol-lg{font-size:100px;}
  .gua-props{grid-template-columns:repeat(2,1fr);}
  .related-gua{grid-template-columns:repeat(2,1fr);}
  .gua-grid{grid-template-columns:repeat(4,1fr);}
  .yao-row{grid-template-columns:50px 1fr;gap:12px;}
}
</style>
</head>
<body>
<div id="topbar-slot"></div>
<div class="layout">
  <div id="sidebar-slot"></div>
  <main class="content">

    <div class="section-head" id="listHead">
      <div class="en">64 Hexagrams</div>
      <h2>六十四卦</h2>
      <div class="title-zhu-sub">上经三十 · 下经三十四 · 三百八十四爻</div>
    </div>

    <!-- 列表视图 -->
    <div id="listView" class="gua-list-wrap">
      <div class="gua-filter">
        <button class="on" data-f="all">全部</button>
        <button data-f="上经">上经</button>
        <button data-f="下经">下经</button>
        <button data-f="乾宫">乾宫</button>
        <button data-f="坎宫">坎宫</button>
        <button data-f="艮宫">艮宫</button>
        <button data-f="震宫">震宫</button>
        <button data-f="巽宫">巽宫</button>
        <button data-f="离宫">离宫</button>
        <button data-f="坤宫">坤宫</button>
        <button data-f="兑宫">兑宫</button>
      </div>
      <div class="gua-grid" id="guaGrid"></div>
    </div>

    <!-- 详情视图 -->
    <div id="detailView" class="gua-detail" style="margin-top:24px;">
      <div style="margin-bottom:14px;">
        <button class="btn btn-ghost" onclick="showList()">← 返回六十四卦列表</button>
      </div>
      <div id="detailContent"></div>
    </div>

  </main>
</div>
<div id="footer-slot"></div>

<script>
document.getElementById('topbar-slot').innerHTML = YJ_Link.topbar('gua');
document.getElementById('sidebar-slot').innerHTML = YJ_Link.sidebar('gua');
document.getElementById('footer-slot').innerHTML = YJ_Link.footer();

const guas = YJ_ONT.LiuShiSiGua||[];
const baguaMap = YJ_ONT.BaGuaMap||{};
const grid = document.getElementById('guaGrid');

// 八宫顺序
const GONGS=['乾宫','坎宫','艮宫','震宫','巽宫','离宫','坤宫','兑宫'];

function renderList(filter='all'){
  let arr=guas;
  if(filter!=='all'){
    if(['上经','下经'].includes(filter)) arr=guas.filter(g=>g.jing===filter);
    else arr=guas.filter(g=>g.gong===filter);
  }
  grid.innerHTML=arr.map(g=>`
    <a class="gua-grid-item" href="#${g.id}" data-id="${g.id}">
      <span class="s">${g.symbol}</span>
      <span class="n">${g.num}.${g.name}</span>
    </a>`).join('');
}
renderList();

// 过滤按钮
document.querySelectorAll('.gua-filter button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.gua-filter button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    renderList(b.dataset.f);
  });
});

// 错卦综卦互卦计算
function cuoGua(g){
  // 阴阳全反：把每个爻反过来
  const all=guas;
  return all.find(x=>x.num!==g.num && x.yao && g.yao &&
    x.yao.every((y,i)=>y.yinYang!==g.yao[i].yinYang));
}
function zongGua(g){
  // 综卦：卦画上下颠倒 = 爻序倒排且阴阳不变
  if(!g.yao||g.yao.length<6) return null;
  const revYao=[...g.yao].reverse();
  return guas.find(x=>x.num!==g.num && x.yao&&
    x.yao.length===revYao.length&&
    x.yao.every((y,i)=>y.yinYang===revYao[i].yinYang));
}
function huGua(g){
  // 互卦：取2、3、4爻为下卦，3、4、5爻为上卦
  if(!g.yao||g.yao.length<6) return null;
  // 简化匹配：找上下卦组合
  return null;
}

function showList(){
  document.getElementById('listView').style.display='block';
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('listHead').style.display='block';
  history.pushState('','','gua.html');
  window.scrollTo({top:0,behavior:'smooth'});
}

function showGua(id){
  const g=guas.find(x=>x.id===id)||guas.find(x=>x.name===id);
  if(!g) return;
  const gf=(YJ_GUA_FULL&&YJ_GUA_FULL[g.name])||{};
  const sg=baguaMap[g.shang], xg=baguaMap[g.xia];

  // 统计阳爻阴爻
  const yangN=(g.yao||[]).filter(y=>y.yinYang==='阳').length;
  const yinN=(g.yao||[]).length-yangN;

  // 相关卦
  const cg=cuoGua(g), zg=zongGua(g);

  document.getElementById('listHead').style.display='none';
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').classList.add('active');

  const html=`
    <div class="gua-detail-card fade-up">
      <div class="gua-header">
        <div class="gua-symbol-lg">${g.symbol}</div>
        <div class="gua-meta">
          <div class="num">第 ${g.num} 卦 · ${g.jing} · ${g.gong||''}</div>
          <h1>${g.name}</h1>
          <div style="color:var(--ink-3);font-family:var(--font-kai);font-size:15px;margin-top:4px;">
            ${sg?`${YJ_Link.ent(sg.name,'bagua',sg.id)}（${sg.ziran}）上`:''}
            ${xg?`${YJ_Link.ent(xg.name,'bagua',xg.id)}（${xg.ziran}）下`:''}
            · ${yangN}阳${yinN}阴
          </div>
          <div class="tags">
            <span class="badge badge-zhu">${g.jing}</span>
            ${g.gong?`<span class="badge badge-gold">${g.gong}</span>`:''}
            ${g.wuxing?`<span class="badge badge-outline">${g.wuxing}</span>`:''}
            ${sg?`<span class="badge badge-outline">上${sg.name}·${sg.ziran}</span>`:''}
            ${xg?`<span class="badge badge-outline">下${xg.name}·${xg.ziran}</span>`:''}
          </div>
        </div>
      </div>

      <div class="gua-props">
        <div class="gua-prop"><div class="k">卦辞</div><div class="v">${YJ_Link.ent(g.name,'gua',g.id)}卦</div></div>
        <div class="gua-prop"><div class="k">错卦</div><div class="v">${cg?YJ_Link.ent(cg.name,'gua',cg.id):'—'}</div></div>
        <div class="gua-prop"><div class="k">综卦</div><div class="v">${zg?YJ_Link.ent(zg.name,'gua',zg.id):'—'}</div></div>
        <div class="gua-prop"><div class="k">互卦</div><div class="v">—</div></div>
      </div>
    </div>

    <div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">卦辞</h3>
      <div class="jingwen">${g.guaci||gf.guaci||''}</div>
      ${gf.guaciBai?`<div class="baihua">${gf.guaciBai}</div>`:''}
    </div>

    <div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">彖传</h3>
      <div class="jingwen">${g.tuan||gf.tuan||''}</div>
    </div>

    <div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">象传</h3>
      <div class="jingwen">${g.xiang||gf.xiang||''}</div>
    </div>

    ${g.wenyan?`<div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">文言传</h3>
      <div class="jingwen">${g.wenyan}</div>
    </div>`:''}

    <div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">六爻</h3>
      ${(g.yao||[]).map((y,i)=>{
        const isYang=y.yinYang==='阳';
        return `<div class="yao-row">
          <div class="yao-idx">
            <div class="pos">${y.pos}</div>
            <div class="sym">${isYang?'━━━':'━ ━'}</div>
            <div class="yy">${isYang?'阳爻':'阴爻'}</div>
          </div>
          <div>
            <div class="yao-text">${y.text||''}</div>
            ${y.xiaoxiang?`<div class="yao-xiaoxiang">《象》曰：${y.xiaoxiang.replace(/《象》[曰：:]+/,'')}</div>`:''}
            ${y.explain?`<div class="yao-explain">${y.explain}</div>`:''}
          </div>
        </div>`;
      }).join('')}
      ${g.yong?`<div class="jingwen" style="margin-top:12px;">${g.yong}</div>`:''}
    </div>

    <div class="gua-detail-card fade-up">
      <h3 style="color:var(--zhu);letter-spacing:3px;margin-top:0;">相关卦</h3>
      <div class="related-gua">
        ${sg?`<a href="#${sg.id}" class="rel-gua-item"><span class="s">${sg.symbol}</span>上卦：${sg.name}</a>`:''}
        ${xg?`<a href="#${xg.id}" class="rel-gua-item"><span class="s">${xg.symbol}</span>下卦：${xg.name}</a>`:''}
        ${cg?`<a href="#${cg.id}" class="rel-gua-item"><span class="s">${cg.symbol}</span>错卦：${cg.name}</a>`:''}
        ${zg?`<a href="#${zg.id}" class="rel-gua-item"><span class="s">${zg.symbol}</span>综卦：${zg.name}</a>`:''}
      </div>
      <div class="jump-btns">
        <a href="animation/gua-${String(g.num-1).padStart(2,'0')}.html" target="_blank">📺 讲解动画</a>
        <a href="reader.html#${g.id}">📖 经文阅读</a>
      </div>
    </div>
  `;
  document.getElementById('detailContent').innerHTML=html;
  document.getElementById('detailView').classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

// hash 路由
function route(){
  const h=location.hash.replace('#','');
  if(h){
    const all=document.querySelectorAll('.gua-grid-item');
    all.forEach(el=>el.classList.toggle('active',el.dataset.id===h));
    showGua(h);
  }else{
    showList();
  }
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
