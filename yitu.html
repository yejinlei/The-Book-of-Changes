<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%98%AF%3C/text%3E%3C/svg%3E">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>易图体系 | 易经本体论</title>
<style>
:root { --bg:#f4ecd8; --paper:#faf6ed; --text:#2b1810; --accent:#8b0000; --gold:#b8860b;
  --ink:#1a1a2e; --blue:#1e3a8a; --border:#d4c5a3; --shadow:rgba(139,0,0,0.08); }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Songti SC','STSong','SimSun','Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC',serif; background:var(--bg); color:var(--text); line-height:2; }
.top-nav { position:fixed; top:0; left:0; right:0; height:64px; background:var(--paper);
  border-bottom:2px solid var(--border); z-index:1000; display:flex; align-items:center; justify-content:space-between;
  padding:0 30px; box-shadow:0 2px 8px var(--shadow); }
.logo { font-size:20px; font-weight:700; color:var(--ink); text-decoration:none; }
.logo .taiji { color:var(--accent); font-size:26px; }
.nav-links { display:flex; gap:18px; flex-wrap:wrap; }
.nav-links a { color:var(--text); text-decoration:none; font-size:14px; font-weight:500; }
.nav-links a:hover, .nav-links a.active { color:var(--accent); }
.nav-links a.active { font-weight:700; }

.wrap { max-width:1150px; margin:64px auto 0; padding:36px 40px 80px; }
.back-link { display:inline-block; color:var(--accent); text-decoration:none; font-size:14px; margin-bottom:18px; }
.back-link:hover { text-decoration:underline; }
.page-head { text-align:center; margin-bottom:36px; }
.page-head h1 { font-size:42px; color:var(--accent); letter-spacing:10px; margin-bottom:8px; }
.page-head p { color:var(--gold); font-size:15px; }

.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:26px; }
.card { background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:26px;
  border-top:3px solid var(--accent); }
.card.wide { grid-column:1 / -1; }
.card h3 { font-size:21px; color:var(--accent); margin-bottom:6px; letter-spacing:2px; }
.card .meta { font-size:12px; color:var(--gold); margin-bottom:14px; }
.card .meta span { margin-right:12px; }
.card .svgbox { text-align:center; margin:14px 0; }
.svgbox svg { max-width:100%; height:auto; }
/* 太极图：缓慢自转——道法自然 */
.svgbox .taiji-spin { transform-origin:115px 115px; animation: taiji-rotate 38s linear infinite; }
.logo .taiji { color:var(--accent); font-size:26px; display:inline-block; animation: taiji-rotate 48s linear infinite; transform-origin:center; }
/* 消息卦爻条律动 */
.xiaoxi-gua { display:inline-flex; flex-direction:column-reverse; align-items:center; gap:2px; margin:0 8px; vertical-align:middle; }
.xiaoxi-gua .xxbar { background:#2a1f14; border-radius:1px; animation: xiaoxi-pulse 3s ease-in-out infinite; transform-origin:center; }
.xiaoxi-gua .xxbar.yang { width:22px; height:4px; }
.xiaoxi-gua .xxbar.yin  { width:9px; height:4px; }
.xiaoxi-label { display:block; font-size:12px; color:#8b0000; margin-top:2px; }
@keyframes taiji-rotate { to { transform: rotate(360deg); } }
@keyframes xiaoxi-pulse {
  0%,100% { opacity:.65; }
  50% { opacity:1; }
}
.card p.desc { font-size:14px; line-height:2; color:#4a3a2a; text-align:justify; }
@media (max-width:820px) {
  .wrap { padding:24px 16px 60px; }
  .grid { grid-template-columns:1fr; }
  .page-head h1 { font-size:30px; letter-spacing:6px; }
  .svgbox svg { max-width:100%; height:auto; }
}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html" class="logo"><span class="taiji">☯</span>易经本体论<small>ONTOLOGY</small></a>
  <div class="nav-links">

    <a href="index.html#masters">历代易学</a>

  </div>
</nav>

<div class="wrap">
  <a class="back-link" href="index.html">← 返回首页</a>
  <div class="page-head">
    <h1>易 图 体 系</h1>
    <p>河图洛书 · 太极两仪 · 先后天八卦 · 六十四卦方圆 · 十二消息卦</p>
  </div>
  <div class="grid" id="tuxiGrid"></div>
</div>

<script src="data/gua-full-data.js"></script>
<script src="data/yijing-ontology.js"></script>
<script src="data/gua-anim.js"></script>
<script>
const ONT = window.YJ_ONT;

// —— 各图的 SVG 矢量绘制（本体 yitu 提供元数据与图说，此处按 id 配矢量图） ——
const SVG = {
  tu_taiji: () => `<svg width="230" height="230" viewBox="0 0 230 230">
    <g class="taiji-spin">
    <circle cx="115" cy="115" r="104" fill="#fdfaf3" stroke="#1a1a2e" stroke-width="2"/>
    <path d="M115,11 A104,104 0 0,1 115,219 A52,52 0 0,0 115,115 A52,52 0 0,1 115,11 Z" fill="#1a1a2e"/>
    <circle cx="115" cy="63" r="16" fill="#1a1a2e"/>
    <circle cx="115" cy="63" r="5" fill="#fdfaf3"/>
    <circle cx="115" cy="167" r="16" fill="#fdfaf3"/>
    <circle cx="115" cy="167" r="5" fill="#1a1a2e"/>
    </g>
  </svg>`,

  tu_xiantian: () => baguaRing([
    ['☰','乾','南',115,32],['☱','兑','东南',182,68],['☲','离','东',203,122],['☳','震','东北',182,176],
    ['☷','坤','北',115,212],['☶','艮','西北',48,176],['☵','坎','西',27,122],['☴','巽','西南',48,68]
  ], '太极'),

  tu_houtian: () => baguaRing([
    ['☲','离','南',115,32],['☴','巽','东南',182,68],['☳','震','东',203,122],['☷','坤','西南',182,176],
    ['☵','坎','北',115,212],['☰','乾','西北',48,176],['☱','兑','西',27,122],['☶','艮','东北',48,68]
  ], '中宫'),

  tu_hetu: () => `<svg width="230" height="230" viewBox="0 0 230 230">
    <circle cx="115" cy="115" r="104" fill="none" stroke="#8b0000" stroke-width="1"/>
    ${dots(115,42,2,'#1a1a2e')}${dots(94,60,7,'#8b0000')}
    ${dots(115,188,1,'#1a1a2e')}${dots(115,206,6,'#8b0000')}
    ${dots(42,115,3,'#1a1a2e')}${dots(30,115,8,'#8b0000')}
    ${dots(188,115,4,'#1a1a2e')}${dots(202,115,9,'#8b0000')}
    ${dots(115,115,5,'#1a1a2e')}${dots(115,131,10,'#8b0000')}
    <text x="115" y="126" text-anchor="middle" font-size="11" fill="#8b0000" font-weight="700">河图五行生成数</text>
  </svg>`,

  tu_luoshu: () => `<svg width="230" height="230" viewBox="0 0 230 230">
    <rect x="20" y="20" width="190" height="190" rx="8" fill="#fdfaf3" stroke="#8b0000"/>
    <line x1="83" y1="20" x2="83" y2="210" stroke="#d4c5a3"/><line x1="147" y1="20" x2="147" y2="210" stroke="#d4c5a3"/>
    <line x1="20" y1="83" x2="210" y2="83" stroke="#d4c5a3"/><line x1="20" y1="147" x2="210" y2="147" stroke="#d4c5a3"/>
    <text x="51" y="58" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">4</text>
    <text x="115" y="58" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">9</text>
    <text x="178" y="58" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">2</text>
    <text x="51" y="120" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">3</text>
    <text x="115" y="120" text-anchor="middle" font-size="22" fill="#8b0000" font-weight="700">5</text>
    <text x="178" y="120" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">7</text>
    <text x="51" y="182" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">8</text>
    <text x="115" y="182" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">1</text>
    <text x="178" y="182" text-anchor="middle" font-size="22" fill="#1a1a2e" font-weight="700">6</text>
  </svg>`,

  tu_64guafang: () => `<svg width="560" height="290" viewBox="0 0 560 290">
    <g transform="translate(145,145)">
      <circle r="105" fill="none" stroke="#8b0000" stroke-width="1.2"/>
      ${circleHexagrams()}
      <text y="6" text-anchor="middle" font-size="13" fill="#8b0000" font-weight="700">圆图·天</text>
    </g>
    <g transform="translate(320,35)">
      <rect width="210" height="210" fill="none" stroke="#8b0000" stroke-width="1.2"/>
      ${squareHexagrams()}
      <text x="105" y="228" text-anchor="middle" font-size="13" fill="#8b0000" font-weight="700">方图·地</text>
    </g>
  </svg>`,

  tu_bagua_64gua: () => `<svg width="300" height="230" viewBox="0 0 300 230">
    ${ONT.bagua.map((b,i)=>{
      const x=40+(i%4)*70, y=60+Math.floor(i/4)*90;
      return `<text x="${x}" y="${y}" text-anchor="middle" font-size="30" fill="#1a1a2e">${b.symbol}</text>
        <text x="${x}" y="${y+22}" text-anchor="middle" font-size="13" fill="#8b0000">${b.name}</text>`;
    }).join('')}
    <text x="150" y="208" text-anchor="middle" font-size="13" fill="#b8860b">八卦相重 · 八八六十四卦</text>
  </svg>`,

  tu_yaobian: () => {
    // 十二消息卦：自下而上 bits 1=阳
    const XX = {
      '复':[1,0,0,0,0,0],'临':[1,1,0,0,0,0],'泰':[1,1,1,0,0,0],'大壮':[1,1,1,1,0,0],
      '夬':[1,1,1,1,1,0],'乾':[1,1,1,1,1,1],'姤':[0,1,1,1,1,1],'遁':[0,0,1,1,1,1],
      '否':[0,0,0,1,1,1],'观':[0,0,0,0,1,1],'剥':[0,0,0,0,0,1],'坤':[0,0,0,0,0,0]
    };
    const months = ['十一月','十二月','正月','二月','三月','四月','五月','六月','七月','八月','九月','十月'];
    let blocks='';
    Object.keys(XX).forEach((n,i)=>{
      const bits = XX[n];
      // 初爻在最下 → 先画 bits[0]（最底）
      let bars='';
      bits.forEach((b,k)=>{
        // k=0 初, k=5 上
        const yy = b?'yang':'yin';
        const delay = i*80 + k*60;
        if(b===1){
          bars += `<div class="xxbar yang" style="animation-delay:${delay}ms"></div>`;
        } else {
          bars += `<div class="xxbar yin" style="animation-delay:${delay}ms"></div><div class="xxbar yin" style="animation-delay:${delay}ms"></div>`;
        }
      });
      blocks += `<div style="display:inline-block;text-align:center;width:42px;margin:0 2px">
        <div class="xiaoxi-gua">${bars}</div>
        <div class="xiaoxi-label">${n}</div>
        <div style="font-size:9px;color:#8b7e6a;margin-top:1px">${months[i]}</div>
      </div>`;
    });
    return `<svg width="560" height="190" viewBox="0 0 560 190" xmlns="http://www.w3.org/2000/svg">
      <foreignObject x="10" y="10" width="540" height="170">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Songti SC',serif">
          <div style="text-align:center">${blocks}</div>
          <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:#b8860b">
            <span>冬至·一阳生</span><span>阳息阴消 →</span><span>夏至·一阴生</span>
          </div>
        </div>
      </foreignObject>
    </svg>`;
  }
};

// 八卦环：position 数组 [符号,名,方位,x,y]
function baguaRing(ring, centerLabel) {
  return `<svg width="230" height="230" viewBox="0 0 230 230">
    <circle cx="115" cy="115" r="104" fill="#fdfaf3" stroke="#8b0000" stroke-width="1.2"/>
    ${ring.map(r=>`
      <text x="${r[3]}" y="${r[4]}" text-anchor="middle" font-size="26" fill="#1a1a2e">${r[0]}</text>
      <text x="${r[3]}" y="${r[4]+16}" text-anchor="middle" font-size="11" fill="#8b0000">${r[1]}</text>
    `).join('')}
    <text x="115" y="120" text-anchor="middle" font-size="13" fill="#8b0000" font-weight="700">${centerLabel}</text>
  </svg>`;
}
// 画点：n 个点围绕中心，简易排布（奇数直列，偶数分列）
function dots(cx, cy, n, color) {
  let out='';
  if (n<=5) { out+=`<circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/>`; }
  const half=Math.floor(n/2), gap=7;
  for (let i=0;i<half;i++){
    const off=(i-(half-1)/2)*gap;
    if(n>5){ out+=`<circle cx="${cx-6}" cy="${cy+off}" r="4.5" fill="${color}"/>`; out+=`<circle cx="${cx+6}" cy="${cy+off}" r="4.5" fill="${color}"/>`; }
    else if(n>1){ out+=`<circle cx="${cx}" cy="${cy+off}" r="4.5" fill="${color}"/>`; }
  }
  return out;
}
// 圆图：先天64卦按序分布于圆周
function circleHexagrams() {
  const arr = ONT.liushisigua;
  let s='';
  for (let i=0;i<64;i++){
    const ang = (i/64)*Math.PI*2 - Math.PI/2;
    const r = 92, x = Math.cos(ang)*r, y = Math.sin(ang)*r;
    s += `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#2b1810">${arr[i].symbol}</text>`;
  }
  return s;
}
// 方图：8×8 卦符网格（先天方图排布）
function squareHexagrams() {
  let s='';
  for (let j=0;j<8;j++) for (let i=0;i<8;i++){
    const g = ONT.liushisigua[(j*8+i)%64];
    s += `<text x="${13+i*26}" y="${20+j*26}" text-anchor="middle" font-size="15" fill="#2b1810">${g.symbol}</text>`;
  }
  return s;
}

function render() {
  document.getElementById('tuxiGrid').innerHTML = ONT.yitu.map(t => {
    const wide = ['tu_64guafang','tu_yaobian'].includes(t.id) ? ' wide' : '';
    const svg = SVG[t.id] ? SVG[t.id]() : '';
    return `<div class="card${wide}">
      <h3>${t.name}</h3>
      <div class="meta"><span>📜 ${t.dynasty||'—'}</span><span>✍ ${t.author||'—'}</span><span>🏷 ${t.xuepai||'—'}</span></div>
      ${svg?`<div class="svgbox">${svg}</div>`:''}
      <p class="desc">${t.desc}</p>
    </div>`;
  }).join('');
}
document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
